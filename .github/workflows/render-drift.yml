name: Render configuration drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - name: Install parser
        run: python -m pip install pyyaml==6.0.2
      - name: Compare provider with reviewed contract
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          test -n "$RENDER_API_TOKEN"
          printf '%s' "$RENDER_API_TOKEN" \
            | python scripts/check_render_drift.py --token-stdin \
                --output "output/evidence/render-drift-${GITHUB_SHA}.json"
      - name: Upload drift receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: render-drift-${{ github.sha }}
          path: output/evidence/render-drift-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
