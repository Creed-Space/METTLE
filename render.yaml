services:
  - type: web
    name: mettle-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Legacy `/api/session/*` state is still process-local. Keep one worker until
    # that surface is migrated to Redis rather than randomly splitting sessions.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: METTLE_ENVIRONMENT
        value: production
      - key: METTLE_SECRET_KEY
        generateValue: true
      - key: METTLE_ADMIN_API_KEY
        sync: false
      - key: METTLE_VCP_SIGNING_KEY
        sync: false
      - key: METTLE_VCP_SIGNING_KEY_ID
        value: mettle-vcp-v1
      - key: METTLE_ALLOWED_ORIGINS
        value: https://mettle.sh,https://www.mettle.sh,https://mettle.is,https://www.mettle.is
      - key: METTLE_USE_DATABASE
        value: "true"
      - key: METTLE_DATABASE_URL
        sync: false
      - key: METTLE_DEV_MODE
        value: "false"
      - key: METTLE_LOG_LEVEL
        value: INFO
      - key: METTLE_RATE_LIMIT_SESSIONS
        value: "10/minute"
      - key: METTLE_RATE_LIMIT_ANSWERS
        value: "60/minute"
    autoDeploy: true
