 [svg('<circle class="hair orbit" cx="850" cy="240" r="195"/>'+Array.from({length:12},(_,k)=>{const a=k*Math.PI/6;return `<circle class="reveal" cx="${850+Math.cos(a)*195}" cy="${240+Math.sin(a)*195}" r="17" fill="#1cd6ba"/>`}).join('')+'<text class="hero reveal" x="60" y="250">Twelve lenses.</text>'),svg(box(80,120,640,220,'Server boundary','Expected answers stay here')+line(720,975,230)+box(975,120,640,220,'External evaluator','Anthropic, only with explicit consent')),'Research hypotheses guide the tasks. The data boundary is explicit.'],

const asset=i===7?'ledger-tablet':i===8?'observatory':(i===0||i===9)?'instrument':null;if(asset){const image=new Image();let fallback=false;image.onerror=()=>{if(asset==='ledger-tablet'&&!fallback){fallback=true;image.src='/video/build/remaster/assets/ledger-keyframe.png';}};image.onload=()=>document.querySelector('#art').style.backgroundImage=`url('${image.src}')`;image.src='/video/build/remaster/assets/'+asset+'-keyframe.png';}
const tl=gsap.timeline({paused:true});const split=duration*.49;const cadenceA=Math.max(.15,(split-4)/Math.max(1,document.querySelectorAll('.a .reveal').length)),cadenceB=Math.max(.15,(duration-split-4)/Math.max(1,document.querySelectorAll('.b .reveal').length));tl.fromTo('h1,.eyebrow',{opacity:0,y:18},{opacity:1,y:0,duration:.8,stagger:.12},.1);tl.fromTo('.a .reveal',{opacity:0,y:18},{opacity:1,y:0,duration:.8,stagger:cadenceA},.8);tl.fromTo('.a .draw',{opacity:0,scaleX:0},{opacity:1,scaleX:1,transformOrigin:'left',duration:1.2,stagger:.25},1.7);tl.fromTo('.orbit',{rotation:-12},{rotation:12,duration,ease:'none',transformOrigin:'center center'},0);tl.fromTo('.particle',{opacity:0,x:0},{opacity:1,x:(index,target)=>Number(target.dataset.distance),duration:Math.max(2,split*.65),stagger:.6},2);tl.to('.a',{opacity:0,y:-18,duration:(i===4||i===9)?.4:.7},split-.5);tl.fromTo('.b',{opacity:0,y:24},{opacity:1,y:0,duration:(i===4||i===9)?.4:.8},split+((i===4||i===9)?.05:0));tl.fromTo('.b .reveal',{opacity:0,y:14},{opacity:1,y:0,duration:.8,stagger:cadenceB},split+.3);tl.fromTo('.b .draw',{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:1.3,transformOrigin:'left'},split+.8);tl.fromTo('.note',{opacity:0},{opacity:1,duration:.8},Math.min(duration-2,split+2));tl.fromTo('#progress',{scaleX:0},{scaleX:1,duration,ease:'none'},0);tl.fromTo('.a svg',{scale:1},{scale:1.025,duration:split,ease:'none',transformOrigin:'center'},0);tl.fromTo('.b svg',{scale:.985},{scale:1.015,duration:duration-split,ease:'none',transformOrigin:'center'},split);tl.fromTo('#art',{scale:1.06},{scale:1,duration,ease:'none'},0);window.__timelines={root:tl};window.seek=t=>{tl.seek(t,false);};window.ready=true;
