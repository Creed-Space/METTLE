services:
  - type: pserv
    name: mettle-holder-staging
    runtime: python
    repo: https://github.com/Creed-Space/METTLE
    branch: main
    plan: starter
    region: oregon
    numInstances: 1
    buildCommand: pip install --require-hashes -r requirements-production.txt
    startCommand: uvicorn mettle.holder_service:app --host 0.0.0.0 --port $PORT --workers 1
    maxShutdownDelaySeconds: 60
    autoDeploy: false
    # Render otherwise overlaps old and new private-service instances during
    # deploys. The holder deliberately permits only one PostgreSQL advisory-lock
    # owner, so an attached disk is the platform-supported stop-first fence.
    # Keys and holder state remain in Vault and PostgreSQL, never on this disk.
    disk:
      name: mettle-holder-singleton-fence
      mountPath: /var/lib/mettle-holder
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: METTLE_HOLDER_ID
        value: mettle-holder-staging-v1
      - key: METTLE_HOLDER_VAULT_URL
        sync: false
      - key: METTLE_HOLDER_VAULT_MOUNT
        value: transit
      - key: METTLE_HOLDER_VAULT_KEY
        value: mettle-holder
      - key: METTLE_HOLDER_VAULT_KEY_VERSION
        value: "1"
      - key: METTLE_HOLDER_VAULT_CA_FILE
        value: /etc/secrets/mettle-holder-vault-ca.pem
      - key: METTLE_HOLDER_VAULT_PUBLIC_KEY_FILE
        value: /etc/secrets/mettle-holder-vault-public-key.pem
      - key: METTLE_HOLDER_VAULT_TOKEN_FILE
        value: /etc/secrets/mettle-holder-vault-token
      - key: METTLE_HOLDER_POLICY_FILE
        value: /etc/secrets/mettle-holder-policy.json
      - key: METTLE_HOLDER_CONTROL_TOKEN_FILE
        value: /etc/secrets/mettle-holder-control-token
      - key: METTLE_HOLDER_STATE_HMAC_KEY_FILE
        value: /etc/secrets/mettle-holder-state-hmac-key
      - key: METTLE_HOLDER_DATABASE_URL
        # Supply a PostgreSQL URL with sslmode=verify-full. Render's synthesized
        # connectionString does not express this reviewed transport contract.
        sync: false
