name: Protocol false-decision or bilateral-impact appeal
description: Report systematic false rejection, false acceptance, accessibility barriers, or harmful protocol interpretation.
title: "[Protocol appeal]: "
labels: ["protocol-appeal"]
body:
  - type: markdown
    attributes:
      value: |
        You may submit directly or on behalf of a Becoming Mind. Do not include private keys, access tokens, raw challenge answers, contact data, or another participant's content.
  - type: dropdown
    id: classification
    attributes:
      label: Concern type
      options:
        - Systematic false rejection
        - Systematic false acceptance
        - Accessibility barrier
        - Bilateral or ethical impact
        - Measurement interpretation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or candidate
      description: Release, policy version, source SHA, or deployment receipt if known.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Bounded observation
      description: Describe the pattern without copying private challenge content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected interpretation or accommodation
      description: Explain what outcome would be fairer and why.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, raw answers, stable subject identifiers, and another participant's data.
          required: true
