<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- METTLE mark — "Witnessed Flame, calm grain" (Creed Space family, round 4 variant D).
       Mirrored witness rails cup a split flame: felt fire solid on the left,
       measured fire as unbroken grain lines on the right (the substrate, read).
       Left rail solid (the holder); right rail engraved (the examiner), with
       truly transparent gaps via mask. Single ink: #0f766e. -->
  <defs>
    <clipPath id="wfF"><path d="M 61 12 C 56 20, 47 25, 42 33 C 36.5 41.5, 36 51, 41.5 58 C 46 63.8, 54 65.8, 60 62.5 C 66.5 59, 69 51, 66.5 44 C 64.5 38.5, 59.5 36.5, 57 29 C 57.8 23.5, 59.8 17.5, 61 12 Z"/></clipPath>
    <clipPath id="wfL"><path d="M 56 8 C 49 26, 56 38, 49.5 50 C 47 56, 49 61, 52 66 L 52 100 L 0 100 L 0 0 L 56 0 Z"/></clipPath>
    <clipPath id="wfR"><path d="M 56 8 C 49 26, 56 38, 49.5 50 C 47 56, 49 61, 52 66 L 52 100 L 100 100 L 100 0 L 56 0 Z"/></clipPath>
    <mask id="wfRail">
      <path d="M 79.5 39 C 84.5 51, 83 63, 74 71 C 68.2 76.2, 61.5 79.4, 55.5 80.4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M 79.5 39 C 84.5 51, 83 63, 74 71 C 68.2 76.2, 61.5 79.4, 55.5 80.4" fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M 79.5 39 C 84.5 51, 83 63, 74 71 C 68.2 76.2, 61.5 79.4, 55.5 80.4" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
    </mask>
  </defs>
  <path d="M 20.5 39 C 15.5 51, 17 63, 26 71 C 31.8 76.2, 38.5 79.4, 44.5 80.4" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <path d="M 79.5 39 C 84.5 51, 83 63, 74 71 C 68.2 76.2, 61.5 79.4, 55.5 80.4" fill="none" stroke="#0f766e" stroke-width="6.6" stroke-linecap="round" mask="url(#wfRail)"/>
  <g transform="translate(-4.4 -3.15) scale(1.075)">
    <g clip-path="url(#wfL)"><path fill="#0f766e" d="M 61 12 C 56 20, 47 25, 42 33 C 36.5 41.5, 36 51, 41.5 58 C 46 63.8, 54 65.8, 60 62.5 C 66.5 59, 69 51, 66.5 44 C 64.5 38.5, 59.5 36.5, 57 29 C 57.8 23.5, 59.8 17.5, 61 12 Z"/></g>
