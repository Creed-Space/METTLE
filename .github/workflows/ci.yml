name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The MCP server is an optional extra; install it so its tests run
          # for real instead of being skipped.
          pip install --require-hashes -r requirements-mcp-lock.txt

      - name: Lint with ruff
        run: |
          ruff check . --ignore E501

      - name: Check Python formatting
        run: |
          ruff format --check .

      - name: Type check with mypy
        run: |
          git ls-files -z '*.py' ':(exclude)**/__main__.py' \
            | xargs -0 mypy --ignore-missing-imports --check-untyped-defs

      - name: Check for unused Python code
        run: |
          vulture main.py config.py database.py \
            mettle red_team scripts/engine.py \
            scripts/build_distribution_receipt.py \
            scripts/build_distributions.py \
            scripts/check_render_drift.py \
            scripts/compare_distributions.py \
            scripts/normalize_sdist.py \
            scripts/verify_pypi_release.py \
            scripts/testing/smoke_installed_mcp.py \
            --min-confidence 80

      - name: Build and validate Python distributions
        run: |
          python -m scripts.build_distributions \
            --source-revision "$GITHUB_SHA" \
            --builder-id "ci-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          twine check dist/*.whl dist/*.tar.gz
          python -m venv /tmp/mettle-production-lock
          /tmp/mettle-production-lock/bin/python -m pip install --require-hashes \
            -r requirements-production.txt
          /tmp/mettle-production-lock/bin/python -m pip install --no-deps dist/*.whl
          /tmp/mettle-production-lock/bin/python -m pip check
          cyclonedx-py environment /tmp/mettle-production-lock/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible --output-file dist/mettle-server.raw.cdx.json
          python scripts/finalize_server_sbom.py \
            --input dist/mettle-server.raw.cdx.json \
            --output dist/mettle-server.cdx.json
          rm dist/mettle-server.raw.cdx.json
          python -m venv /tmp/mettle-wheel-smoke
          /tmp/mettle-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/mettle-wheel-smoke/bin/mettle --help
          set +e
          printf '\n\n\n\n\n' | /tmp/mettle-wheel-smoke/bin/mettle verify --json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Validate installed MCP surface
        run: |
          python -m venv /tmp/mettle-mcp-wheel-smoke
          wheel=$(printf '%s' dist/*.whl)
          /tmp/mettle-mcp-wheel-smoke/bin/python -m pip install "${wheel}[mcp]"
          /tmp/mettle-mcp-wheel-smoke/bin/python \
            scripts/testing/smoke_installed_mcp.py

      - name: Validate production dependency lock
        run: |
          /tmp/mettle-production-lock/bin/python -m pip check

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mettle-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Run tests with coverage
        env:
          METTLE_SECRET_KEY: "ci-test-secret-key-12345"
          METTLE_ADMIN_API_KEY: "ci-test-admin-key-12345"
          METTLE_ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --tb=short \
            --cov=main --cov=config --cov=database \
            --cov=mettle --cov=red_team --cov=scripts.engine \
            --cov-report=xml --cov-report=term-missing --cov-fail-under=90 \
            --reruns 2 --reruns-delay 1

      - name: Install static frontend tooling
        run: npm ci

      - name: Check deployed frontend JavaScript
        run: npm run check:js

      - name: Check static routes, metadata, and asset fingerprints
        run: npm run check:static

      - name: Check public OpenAPI compatibility
        run: npm run check:openapi

      - name: Check cross-language credential fixtures
        run: npm run check:fixtures

      - name: Check deployed frontend design
        run: npm run design:check

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The MCP surface mutant must execute rather than become an invalid
          # skipped baseline when the optional server dependency is absent.
          pip install --require-hashes -r requirements-mcp-lock.txt

      - name: Security scan with bandit
        run: |
          bandit -q -r main.py config.py database.py \
            mettle red_team scripts/engine.py \
            scripts/build_distribution_receipt.py \
            scripts/build_distributions.py \
            scripts/check_render_drift.py \
            scripts/compare_distributions.py \
            scripts/normalize_sdist.py \
            scripts/verify_pypi_release.py \
            scripts/testing/smoke_installed_mcp.py \
            --skip B101

      - name: Scan for committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          binary_suffixes = {
              ".gz", ".ico", ".jpeg", ".jpg", ".mp3", ".mp4", ".pdf",
              ".png", ".ttf", ".wav", ".webp", ".woff", ".woff2", ".zip",
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).decode().split("\0")
          files = [
              filename
              for filename in tracked
              if filename
              and not filename.startswith("memory/")
              and filename != ".secrets.baseline"
              and Path(filename).suffix.lower() not in binary_suffixes
          ]
          raise SystemExit(
              subprocess.run(
                  ["detect-secrets-hook", "--baseline", ".secrets.baseline", *files],
                  check=False,
              ).returncode
          )
          PY

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements-production.txt

      - name: Audit development dependencies
        run: |
          pip-audit -r requirements-dev.txt

      - name: Audit static frontend tooling
        run: npm audit --audit-level=low

      - name: Prove focused security tests kill invariant mutations
        run: >-
          python scripts/testing/run_security_mutation_gate.py
          --output output/evidence/security-mutation-${{ github.sha }}.json

      - name: Upload security mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-mutation-${{ github.sha }}
          path: output/evidence/security-mutation-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

  cli-compatibility:
    name: CLI compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0
          python -m build --wheel
          python -m venv /tmp/mettle-wheel-smoke
          /tmp/mettle-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/mettle-wheel-smoke/bin/mettle --version
          /tmp/mettle-wheel-smoke/bin/mettle suites
          set +e
          printf '\n\n\n\n\n' | /tmp/mettle-wheel-smoke/bin/mettle verify --json
          status=$?
          set -e
          test "$status" -eq 1

  reproducible-build:
    name: Reproducible distribution (${{ matrix.builder }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        builder: [linux-1, linux-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Build deterministic distributions
        run: |
          python -m pip install --disable-pip-version-check build==1.5.0
          python -m scripts.build_distributions \
            --source-revision "$GITHUB_SHA" \
            --builder-id "${{ matrix.builder }}"
      - name: Upload independent distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reproducible-${{ matrix.builder }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  legacy-multiworker:
    name: Legacy session multiworker authority
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-production.txt
      - name: Alternate one legacy session across two workers
        env:
          METTLE_REDIS_URL: redis://127.0.0.1:6379/15
        run: python scripts/testing/run_legacy_multiworker_trial.py

  browser-acceptance:
    name: Browser, accessibility, and performance acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install exact application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-production.txt
          # Static publication validation deterministically rebuilds the
          # vendored Font Awesome subsets before Playwright starts.
          python -m pip install "fonttools[woff]==4.63.0"
      - name: Install exact browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate static publication contract
        run: npm run check:static
      - name: Run browser acceptance
        env:
          CI: "true"
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: browser-acceptance-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
