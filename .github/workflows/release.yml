name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-candidate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m build
          twine check dist/*
          python -m venv /tmp/mettle-production-lock
          /tmp/mettle-production-lock/bin/python -m pip install --require-hashes \
            -r requirements-production.txt
          /tmp/mettle-production-lock/bin/python -m pip install --no-deps dist/*.whl
          /tmp/mettle-production-lock/bin/python -m pip check
          cyclonedx-py environment /tmp/mettle-production-lock/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible --output-file dist/mettle-server.raw.cdx.json
          python scripts/finalize_server_sbom.py \
            --input dist/mettle-server.raw.cdx.json \
            --output dist/mettle-server.cdx.json
          rm dist/mettle-server.raw.cdx.json
          python scripts/build_release_manifest.py \
            --source-sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          (cd dist && shasum -a 256 ./* > SHA256SUMS)
          (cd dist && shasum -a 256 --check SHA256SUMS)
      - name: Attest release distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/mettle-server.cdx.json
            dist/RELEASE-MANIFEST.json
            dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: false
          body_path: dist/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*
