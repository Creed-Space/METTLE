name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check . --ignore E501

      - name: Check Python formatting
        run: |
          ruff format --check .

      - name: Type check with mypy
        run: |
          git ls-files -z '*.py' ':(exclude)**/__main__.py' \
            | xargs -0 mypy --ignore-missing-imports --check-untyped-defs

      - name: Check for unused Python code
        run: |
          vulture main.py config.py database.py mcp_server.py \
            mettle red_team scripts/engine.py --min-confidence 80

      - name: Build and validate Python distributions
        run: |
          python -m build
          twine check dist/*
          cyclonedx-py environment "$(command -v python)" --pyproject pyproject.toml \
            --output-reproducible --output-file dist/mettle-server.cdx.json
          python -m venv /tmp/mettle-wheel-smoke
          /tmp/mettle-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/mettle-wheel-smoke/bin/mettle --help
          set +e
          printf '\n\n\n\n\n' | /tmp/mettle-wheel-smoke/bin/mettle verify --json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mettle-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Run tests with coverage
        env:
          METTLE_SECRET_KEY: "ci-test-secret-key-12345"
          METTLE_ADMIN_API_KEY: "ci-test-admin-key-12345"
          METTLE_ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --tb=short \
            --cov=main --cov=config --cov=database --cov=mcp_server \
            --cov=mettle --cov=red_team --cov=scripts.engine \
            --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Install static frontend tooling
        run: npm ci

      - name: Check deployed frontend JavaScript
        run: npm run check:js

      - name: Check deployed frontend design
        run: npm run design:check

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Security scan with bandit
        run: |
          bandit -q -r main.py config.py database.py mcp_server.py \
            mettle red_team scripts/engine.py --skip B101

      - name: Scan for committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          binary_suffixes = {
              ".gz", ".ico", ".jpeg", ".jpg", ".mp3", ".mp4", ".pdf",
              ".png", ".ttf", ".wav", ".webp", ".woff", ".woff2", ".zip",
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).decode().split("\0")
          files = [
              filename
              for filename in tracked
              if filename
              and not filename.startswith("memory/")
              and filename != ".secrets.baseline"
              and Path(filename).suffix.lower() not in binary_suffixes
          ]
          raise SystemExit(
              subprocess.run(
                  ["detect-secrets-hook", "--baseline", ".secrets.baseline", *files],
                  check=False,
              ).returncode
          )
          PY

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Audit development dependencies
        run: |
          pip-audit -r requirements-dev.txt

      - name: Audit static frontend tooling
        run: npm audit --audit-level=low

  cli-compatibility:
    name: CLI compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0
          python -m build --wheel
          python -m venv /tmp/mettle-wheel-smoke
          /tmp/mettle-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/mettle-wheel-smoke/bin/mettle --version
          /tmp/mettle-wheel-smoke/bin/mettle suites
          set +e
          printf '\n\n\n\n\n' | /tmp/mettle-wheel-smoke/bin/mettle verify --json
          status=$?
          set -e
          test "$status" -eq 1
