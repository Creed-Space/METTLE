name: Update Footer Year

on:
  schedule:
    # Runs at 00:15 AM UTC on January 1st each year
    - cron: '15 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-footer-year
  cancel-in-progress: false

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the four public HTML footers
        run: python3 scripts/update_footer_year.py

      - name: Validate the resulting static site
        run: |
          python3 scripts/update_asset_fingerprints.py --check
          python3 scripts/check_static_site.py

      - name: Commit if changed
        run: |
          YEAR=$(date +%Y)
          SHORT_YEAR=$(date +%y)
          if ! git diff --quiet -- static/index.html static/docs.html static/test.html static/about.html; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add static/index.html static/docs.html static/test.html static/about.html
            if [ "$YEAR" = "2026" ]; then
              git commit -m "chore: verify copyright year 2026"
            else
              git commit -m "chore: update copyright year to 2026-$SHORT_YEAR"
            fi
            git push
          fi
