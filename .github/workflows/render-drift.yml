name: Render configuration drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install parser
        run: >-
          python -m pip install --require-hashes
          -r requirements-drift-lock.txt
      - name: Compare provider with reviewed contract
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SECRET_FINGERPRINTS: ${{ secrets.RENDER_SECRET_FINGERPRINTS }}
        run: |
          test -n "$RENDER_API_TOKEN"
          test -n "$RENDER_SECRET_FINGERPRINTS"
          printf '%s' "$RENDER_API_TOKEN" \
            | python scripts/check_render_drift.py --token-stdin \
                --output "output/evidence/render-drift-${GITHUB_SHA}.json"
      - name: Upload drift receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: render-drift-${{ github.sha }}
          path: output/evidence/render-drift-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
