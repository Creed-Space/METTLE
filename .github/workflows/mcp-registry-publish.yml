name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry using GitHub Actions OIDC.
# OIDC from this repo grants the io.github.Creed-Space/* namespace (the registry
# grants the repository owner's namespace to Actions runs — no user token needed).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published PyPI version to verify before registry publication"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify public package and manifest version
        run: |
          test "$(python -c 'import json; print(json.load(open("server.json"))["version"])')" = \
            "${{ inputs.version }}"
          python scripts/verify_pypi_release.py \
            --version "${{ inputs.version }}" \
            --output /tmp/PYPI-PUBLICATION.json

      - name: Install mcp-publisher
        run: |
          curl --fail-with-body --location --silent --show-error \
            --output /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: |
          if python -c \
            'from scripts.build_distribution_receipt import wait_for_registry; import os; wait_for_registry(os.environ["VERSION"], attempts=1, delay=0)'
          then
            echo "Official MCP Registry already exposes the exact active release."
          else
            mcp-publisher publish
          fi
        env:
          VERSION: ${{ inputs.version }}
