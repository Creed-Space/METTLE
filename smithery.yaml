# Smithery deployment config for the METTLE MCP server.
# Docs: https://smithery.ai/docs/build/project-config
#
# Deployed as a custom container. The image (see Dockerfile) defaults to stdio
# for the Docker MCP Catalog and `docker run -i` consumers; Smithery flips it to
# Streamable HTTP via the `env` block below. Smithery injects $PORT, which the
# Dockerfile maps onto --port.
runtime: container

startCommand:
  type: http
  # Smithery passes each caller's API key in a secret-bearing HTTP header. The
  # server validates it against the canonical METTLE API before dispatch and
  # uses only that caller's identity and quota upstream. No process-wide key is
  # accepted by the HTTP transport.
  configSchema:
    type: object
    properties:
      mettleApiKey:
        type: string
        title: METTLE API key
        description: A caller-owned METTLE API key
        x-from:
          header: x-mettle-api-key
        x-to:
          header: x-mettle-api-key
    required:
      - mettleApiKey
    additionalProperties: false
  exampleConfig:
    mettleApiKey: mtl_REPLACE_WITH_YOUR_KEY  # pragma: allowlist secret

build:
  dockerfile: Dockerfile
  dockerBuildPath: "."

# Run the container in Streamable HTTP mode for Smithery's gateway.
# The bind guard opt-out (METTLE_MCP_ALLOW_INSECURE_HTTP) lives in the
# Dockerfile's http branch, not here, so it cannot leak into a direct
# `docker run` of the image.
env:
  METTLE_MCP_TRANSPORT: "http"
  METTLE_MCP_ALLOWED_HOSTS: "*.smithery.run,*.smithery.ai"
