[package]
name = "mettle-credential-fixture-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "verify-credential-fixture"
path = "verify_credential_fixture.rs"

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
