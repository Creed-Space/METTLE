[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
# SlowAPI 0.1.10 still calls the Python 3.14 compatibility alias. Production
# runs Python 3.11; keep local 3.14 test output clean until SlowAPI migrates.
filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated.*:DeprecationWarning:slowapi\.extension
