version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    # `requirements-production.txt` and the `*-lock.txt` files are pip-compile
    # output, so Dependabot reads every pin in them as a manifest entry it may
    # raise on its own. That is wrong for any package a parent pins with `==`,
    # because the two have to move together or the lock stops resolving.
    #
    # pydantic pins pydantic-core exactly. Dependabot raised pydantic-core to
    # 2.48.0, which belongs to the unreleased pydantic 2.14, while pydantic
    # stayed at 2.13.4 pinning 2.46.4, and four jobs failed at dependency
    # install. Filtering by `dependency-type: direct` does not help: the pin is
    # written into a file Dependabot parses as a manifest, so it classifies
    # pydantic-core as direct and proposes it anyway.
    #
    # pydantic itself stays eligible. When it moves, regenerate the locks with
    # pip-compile so the matching pydantic-core lands in the same commit.
    ignore:
      - dependency-name: pydantic-core
    groups:
      python-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    groups:
      frontend-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
