name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry using GitHub Actions OIDC.
# OIDC from this repo grants the io.github.Creed-Space/* namespace (the registry
# grants the repository owner's namespace to Actions runs — no user token needed).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mcp-publisher
        run: |
          curl --fail-with-body --location --silent --show-error \
            --output /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
