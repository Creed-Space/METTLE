name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0  # v4

      - name: Set up Python
        uses: actions/setup-python@v6.3.0  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check . --ignore E501

      - name: Check Python formatting
        run: |
          ruff format --check .

      - name: Type check with mypy
        run: |
          git ls-files -z '*.py' ':(exclude)**/__main__.py' \
            | xargs -0 mypy --ignore-missing-imports --check-untyped-defs

      - name: Check for unused Python code
        run: |
          vulture main.py config.py database.py mcp_server.py \
            mettle red_team scripts/engine.py --min-confidence 80

      - name: Run tests with coverage
        env:
          METTLE_SECRET_KEY: "ci-test-secret-key-12345"
          METTLE_ADMIN_API_KEY: "ci-test-admin-key-12345"
          METTLE_ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --tb=short \
            --cov=main --cov=config --cov=database --cov=mcp_server \
            --cov=mettle --cov=red_team --cov=scripts.engine \
            --cov-report=xml --cov-report=term-missing --cov-fail-under=90 \
            --reruns 2 --reruns-delay 1

      - name: Install static frontend tooling
        run: npm ci

      - name: Check deployed frontend JavaScript
        run: npm run check:js

      - name: Check deployed frontend design
        run: npm run design:check

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0  # v4

      - name: Set up Python
        uses: actions/setup-python@v6.3.0  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Security scan with bandit
        run: |
          bandit -q -r main.py config.py database.py mcp_server.py \
            mettle red_team scripts/engine.py --skip B101

      - name: Scan for committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          binary_suffixes = {
              ".gz", ".ico", ".jpeg", ".jpg", ".mp3", ".mp4", ".pdf",
              ".png", ".ttf", ".wav", ".webp", ".woff", ".woff2", ".zip",
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).decode().split("\0")
          files = [
              filename
              for filename in tracked
              if filename
              and not filename.startswith("memory/")
              and filename != ".secrets.baseline"
              and Path(filename).suffix.lower() not in binary_suffixes
          ]
          raise SystemExit(
              subprocess.run(
                  ["detect-secrets-hook", "--baseline", ".secrets.baseline", *files],
                  check=False,
              ).returncode
          )
          PY

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Audit static frontend tooling
        run: npm audit --audit-level=low
